%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/novatek,nt37701.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT37701-based DSI display panels

maintainers:
  - Val Packett <val@packett.cool>

description:
  The Novatek NT37701 is a generic DSI Panel IC used to control AMOLED panels.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    items:
      - enum:
          - csot,nt37701-dubai
          - tianma,nt37701-dubai
      - const: novatek,nt37701

  reg:
    maxItems: 1

  vddio-supply:
    description: I/O voltage rail

  dvdd-supply:
    description: Digital voltage rail

  vdd-supply:
    description: Analog voltage rail

required:
  - compatible
  - reg
  - reset-gpios
  - vddio-supply
  - dvdd-supply
  - vdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "tianma,nt37701-dubai", "novatek,nt37701";
            reg = <0>;

            reset-gpios = <&tlmm 44 GPIO_ACTIVE_LOW>;

            dvdd-supply = <&disp_dvdd_1p25>;
            vdd-supply = <&disp_vci_3p0>;
            vddio-supply = <&disp_iovcc_1p8>;

            port {
                panel_in_0: endpoint {
                    remote-endpoint = <&dsi0_out>;
                };
            };
        };
    };

...

