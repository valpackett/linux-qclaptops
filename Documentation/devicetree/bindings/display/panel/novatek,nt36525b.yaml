%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/novatek,nt36525b.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT36525B LCD DSI Panel

maintainers:
  - Val Packett <val@packett.cool>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    items:
      - const: tianma,nt36525b-cebu
      - const: novatek,nt36525b

  reg:
    maxItems: 1
    description: DSI virtual channel

  avdd-supply: true
  avee-supply: true
  vddi-supply: true
  port: true
  reset-gpios: true
  backlight: true

required:
  - compatible
  - reg
  - vddi-supply
  - avdd-supply
  - avee-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    dsi {
        #address-cells = <1>;
        #size-cells = <0>;
        panel@0 {
            compatible = "tianma,nt36525b-cebu", "novatek,nt36525b";
            reg = <0>;

            avdd-supply = <&pmi632_lcdb_ldo>;
            avee-supply = <&pmi632_lcdb_ncp>;
            vddi-supply = <&pm6125_l9a>;

            backlight = <&i2c_backlight>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };
...

